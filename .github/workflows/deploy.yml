name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:      # manual "Run workflow" button
  schedule:
    - cron: "0 6 * * *"   # daily: picks up publications.bib / CV changes made via Overleaf

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout CV repo (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: 929937690/cv-yuntaoli
          ssh-key: ${{ secrets.CV_REPO_DEPLOY_KEY }}
          path: cv-repo

      - name: Sync bibliography and CV PDF from CV repo
        run: |
          cp cv-repo/publications.bib _bibliography/publications.bib
          mkdir -p files
          cp cv-repo/main.pdf files/CV_YuntaoLi.pdf
          rm -rf cv-repo

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
