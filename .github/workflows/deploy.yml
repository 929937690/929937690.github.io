name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:      # manual "Run workflow" button
  schedule:
    - cron: "0 6 * * *"   # daily: picks up publications.bib / CV changes made via Overleaf

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout CV folder from personal repo (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: 929937690/personal
          ssh-key: ${{ secrets.PERSONAL_REPO_DEPLOY_KEY }}
          path: personal-repo
          fetch-depth: 0
          sparse-checkout: |
            cv-yuntaoli

      - name: Sync bibliography (stripping double-blind entries) and CV PDF
        run: |
          ruby -e '
            src = File.read("personal-repo/cv-yuntaoli/publications.bib")
            pub = src.gsub(/@\w+\{[^@]*?\n\}\s*/m) { |blk|
              blk =~ /keywords\s*=\s*\{[^}]*\bblind\b[^}]*\}/i ? "" : blk
            }
            File.write("_bibliography/publications.bib", pub)
          '

          tex_ts=$(git -C personal-repo log -1 --format="%ct" -- cv-yuntaoli/main.tex cv-yuntaoli/publications.bib)
          pdf_ts=$(git -C personal-repo log -1 --format="%ct" -- cv-yuntaoli/main.pdf)
          if [ "${tex_ts:-0}" -gt "${pdf_ts:-0}" ]; then
            echo "CV source is newer than main.pdf (e.g. pushed from Overleaf); compiling public main.pdf..."
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              texlive-latex-base texlive-latex-recommended texlive-latex-extra \
              texlive-bibtex-extra texlive-fonts-recommended biber
            (
              cd personal-repo/cv-yuntaoli
              pdflatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null
              biber main >/dev/null
              pdflatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null
              pdflatex -interaction=nonstopmode -halt-on-error main.tex >/dev/null
            )
          fi

          mkdir -p files
          cp personal-repo/cv-yuntaoli/main.pdf files/CV_YuntaoLi.pdf
          rm -rf personal-repo

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
