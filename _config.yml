# Site Configuration — Yuntao Li (https://929937690.github.io)

locale                   : "en-US"
title                    : "Yuntao Li"
name                     : "Yuntao Li"
description              : "Yuntao Li — Ph.D. student in Computer Science at the University of Florida (V2LA Lab). Assured autonomy; formal and runtime verification of learning-enabled cyber-physical systems; safe and trustworthy AI."
url                      : https://929937690.github.io
baseurl                  : ""
repository               : "929937690/929937690.github.io"
timezone                 : Etc/UTC
encoding                 : "utf-8"

# Publications generated from _bibliography/publications.bib via jekyll-scholar
scholar:
  style: ieee
  locale: en-US
  source: ./_bibliography
  bibliography: publications.bib
  bibliography_template: bib_entry
  sort_by: year,presort
  order: descending,ascending
  group_by: none
  bibtex_filters:
    - latex
  query: "@*"

# Reading & Exclusions
include:
  - _pages
  - files
exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - _config_docker.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor

# Markdown & Sass
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  sass_dir: _sass
  style: compressed

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-scholar

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-scholar
